services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: life360_postgis
    environment:
      POSTGRES_DB: life360
      POSTGRES_USER: life360_user
      POSTGRES_PASSWORD: life360_secure_password
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U life360_user -d life360"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgis_data:
    driver: local
