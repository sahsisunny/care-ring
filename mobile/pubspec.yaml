name: life360_mobile
description: "Production-ready, cross-platform real-time family location-sharing app MVP"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_maps_flutter: ^2.6.0
  web_socket_channel: ^2.4.1
  geolocator: ^11.0.0
  sensors_plus: ^5.0.1
  flutter_local_notifications: ^17.1.0
  url_launcher: ^6.2.6
  http: ^1.2.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
